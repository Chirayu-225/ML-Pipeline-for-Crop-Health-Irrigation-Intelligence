[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cropiq"
version = "0.1.0"
description = "Crop Health and Irrigation Intelligence: CNN + DDPM + VAE + SNN multimodal pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "matplotlib>=3.7",
  "tqdm>=4.66",
  "opencv-python-headless>=4.8",
  "albumentations>=2.0",
  "torch>=2.2",
  "torchvision>=0.17",
  "snntorch>=0.9",
]

[project.optional-dependencies]
serve = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "streamlit>=1.32",
  "requests>=2.31",
]
tracking = ["mlflow>=2.10", "wandb>=0.16"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
